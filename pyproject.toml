[project]
name = "pokedex-api"
version = "1.3.7"
description = "API REST de Pokédex personal: cliente de PokeAPI y servidor FastAPI con autenticación JWT."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bcrypt==4.0.1",
  "cryptography>=46",
  "fastapi>=0.115",
  "httpx>=0.28",
  "passlib[bcrypt]>=1.7.4",
  "pillow>=11.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.18",
  "reportlab>=4.2",
  "slowapi>=0.1.9",
  "sqlmodel>=0.0.22",
  "tzdata>=2025.1",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.8",
]

# ─────────────────────────────────────────────────────────────
#  Tests
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
  # Aviso de Starlette sobre su cliente de tests; no afecta al código de la aplicación.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ─────────────────────────────────────────────────────────────
#  Estilo y análisis estático
# ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # orden de imports
  "B",   # bugbear: errores habituales
  "UP",  # sintaxis moderna de Python
  "S",   # bandit: problemas de seguridad
  "SIM", # simplificaciones
  "RUF", # reglas propias de ruff
]
# «×» es el multiplicador de daño de los tipos (×2, ×½), no una «x» por error
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",         # en los tests se usa assert
  "S105", "S106", # credenciales ficticias de prueba
  "S311",         # random con semilla para combates reproducibles
]
