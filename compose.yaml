# ═════════════════════════════════════════════════════════════
#  Pokédex API por HTTPS en el puerto 443:  docker compose up --build
#
#  caddy  → termina TLS en 443 (certificado de su CA interna) y redirige 80 → 443
#  api    → FastAPI en una red interna, sin puertos publicados: solo se llega a ella
#           a través de Caddy
# ═════════════════════════════════════════════════════════════
name: pokedex-api

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped

services:
  api:
    <<: *hardening
    build: .
    image: pokedex-api:local
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: sqlite:////data/pokedex.db
      LOG_FILE: ""
      ALLOWED_HOSTS: ${SITE_HOST:-localhost},127.0.0.1
      GOOGLE_REDIRECT_URI: https://${SITE_HOST:-localhost}/api/v1/auth/google/callback
      # Solo Caddy puede indicar la IP real del cliente (X-Forwarded-For). Cualquier
      # otra IP que envíe esa cabecera se ignora, así que no sirve para saltarse el
      # rate limiting ni el bloqueo de cuenta.
      FORWARDED_ALLOW_IPS: 172.30.0.2
    volumes:
      - api-data:/data
    networks:
      backend:
        ipv4_address: 172.30.0.3

  caddy:
    <<: *hardening
    image: caddy:2.11-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    cap_add: [NET_BIND_SERVICE] # escuchar en 80 y 443
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # CA interna y certificados
      - caddy-config:/config
    networks:
      backend:
        ipv4_address: 172.30.0.2

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  api-data:
  caddy-data:
  caddy-config:
